mmapsConfig:
  # Skip extracting liquid surfaces into the navmesh.
  # Useful for flying-only builds. Default false.
  skipLiquid: false

  # Skip the main world continents (Azeroth, Outland, Northrend, Pandaria, Draenor,
  # Broken Isles, Argus...). Default false.
  skipContinents: false

  # Skip maps marked as "junk" (deprecated/test maps the client never loads).
  # Default true.
  skipJunkMaps: true

  # Skip battleground / arena maps. Default false.
  skipBattlegrounds: false

  # Path to the directory containing navigation data files.
  # This directory should contain the "maps" and "vmaps" folders,
  # and is also where the "mmaps" folder will be created or located.
  # The generator falls back to the executable's directory if the
  # current working directory has no "maps" folder.
  dataDir: "./"

  meshSettings:
    # Global Recast knobs. These cascade: global -> map override -> tile override.

    # --- Cell Size Calculation ---
    # Most parameters below are defined in "cell units".
    # Cell units are converted to world units via:
    #
    #     cellSize = MMAP::GRID_SIZE / verticesPerMapEdge
    #
    # Where MMAP::GRID_SIZE = 533.3333 (one map tile in world units).
    #
    # Example: vertexPerMapEdge = 2000 => cellSize ≈ 0.2667 world units.
    # A walkableClimb of 8 cells therefore = ~2.13 world units.

    # Maximum slope angle (degrees) NPCs can walk on.
    # Legion stock default is 70°, more permissive than 3.3.5a (60°).
    walkableSlopeAngle: 70

    # Minimum ceiling height (cell units) NPCs need to pass under an obstacle.
    walkableHeight: 6

    # Maximum height difference (cell units) NPCs can step up or down.
    # 4 = NPCs walk AROUND fences/ledges (visually cleaner, matches classic WotLK feel).
    # 6 = NPCs hop over short fences (vanilla WotLK behavior).
    # 8 = permissive, NPCs step over Legion-era props (was the stock Legion default).
    # Lower values produce more natural movement at the cost of less navmesh coverage
    # near small obstacles. Raise per-map below if a specific zone needs it.
    walkableClimb: 4

    # Minimum distance (cell units) around walkable surfaces.
    # Prevents NPCs from clipping into walls and narrow gaps.
    walkableRadius: 2

    # Number of vertices along one edge of the entire map's navmesh grid.
    # Higher = more accurate but more CPU/memory.
    vertexPerMapEdge: 2000

    # Number of vertices along one edge of each tile chunk.
    # Must divide vertexPerMapEdge cleanly for seamless tiling.
    vertexPerTileEdge: 80

    # Tolerance for polygon simplification. Higher = simpler but less accurate.
    maxSimplificationError: 1.8

    # --- Per-map / per-tile overrides ---
    # Override any global parameter for a specific map by its map ID.
    # Inside each map override, override per individual tile via "tileX,tileY" keys.
    #
    # Cascade: global -> map -> tile.
    #
    # Example:
    # mapsOverrides:
    #   "0":                              # Eastern Kingdoms
    #     walkableRadius: 3
    #     tilesOverrides:
    #       "50,70":
    #         walkableSlopeAngle: 65
    #         walkableClimb: 4
    mapsOverrides: {}

  # debugOutput generates OBJ debug files in the `meshes/` folder, usable in
  # RecastDemo (https://github.com/jackpoz/recastnavigation).
  # Workflow:
  #   1. Move character to the area to debug
  #   2. In game: .mmap loc -> prints current tile file + recast config
  #   3. Enable debugOutput here and regenerate (delete the .mmtile to force rebuild)
  #   4. Copy meshes/* to RecastDemo's Meshes/ folder and inspect
  debugOutput: false
